{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AAFIA ENTERPRISE{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="app-page">
    <div class="app-shell">
        <aside class="app-sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <a class="app-brand" href="{% url 'dashboard' %}"><span class="app-brand-mark">AE</span><span class="app-brand-copy">AAFIA<br><b>ENTERPRISE</b></span></a>
                <button class="sidebar-toggle" type="button" aria-controls="app-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><span aria-hidden="true">&laquo;</span></button>
            </div>
            <p class="sidebar-label">Workspace</p>
            <nav class="side-nav" aria-label="System navigation">
                <a href="{% url 'dashboard' %}"><span class="nav-number">01</span><span class="nav-label">Dashboard</span></a>
                <a href="{% url 'product-setup' %}"><span class="nav-number">02</span><span class="nav-label">Product Setup</span></a>
                <a href="{% url 'daily-sales-page' %}"><span class="nav-number">03</span><span class="nav-label">Daily Sales</span></a>
                <a href="{% url 'daily-summary-page' %}"><span class="nav-number">04</span><span class="nav-label">Monthly Summary</span></a>
                <a href="{% url 'monthly-export' %}"><span class="nav-number">05</span><span class="nav-label">Export</span></a>
                <a href="{% url 'godown-stock' %}"><span class="nav-number">06</span><span class="nav-label">Godown Stock</span></a>
            </nav>
            <a class="back-home" href="{% url 'home' %}"><span class="back-home-label">Return to landing</span><b>&#8599;</b></a>
        </aside>
        <main class="app-main">{% block content %}{% endblock %}</main>
    </div>
    <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
