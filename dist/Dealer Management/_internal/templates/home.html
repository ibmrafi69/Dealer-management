
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AAFIA ENTERPRISE Sales and Inventory System">
    <title>AAFIA ENTERPRISE | Sales and Inventory System</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="landing-page">
    <div class="hero-atmosphere" aria-hidden="true">
        <span class="glow glow-primary"></span>
        <span class="glow glow-secondary"></span>
        <span class="grid-horizon"></span>
        <span class="orb orb-large"></span>
        <span class="orb orb-small"></span>
    </div>

    <header class="topbar">
        <a class="brand-mark" href="{% url 'home' %}" aria-label="AAFIA ENTERPRISE home">
            <img src="{% static 'images/aafia-logo.png' %}" alt="AAFIA ENTERPRISE">
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a class="active" href="{% url 'home' %}">Home</a>
            <a href="#about">About us</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="hero-shell" id="about">
        <section class="hero-content" aria-labelledby="page-title">
            <p class="eyebrow">Sales operations, simplified</p>
            <h1 id="page-title">AAFIA<br><span>ENTERPRISE</span></h1>
            <p class="subtitle">Sales and Inventory System</p>
            <a class="primary-button" href="{% url 'dashboard' %}">
                <span>ENTER SYSTEM</span>
                <span class="button-arrow" aria-hidden="true">&#8594;</span>
            </a>
            <p class="supporting-line">Inventory <i></i> Orders <i></i> Returns <i></i> Damage <i></i> Reports</p>
        </section>
    </main>

    <footer class="hero-footer" id="contact">
        <span>AAFIA ENTERPRISE</span>
        <span>One clear view of your business</span>
    </footer>
</body>
</html>
